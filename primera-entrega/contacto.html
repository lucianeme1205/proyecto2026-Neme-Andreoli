<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lucía Neme y Sofía Andreoli">
    <meta name="description" content="Escribinos tu consulta sobre los productos de cosmética Tersa.">
    <meta name="keywords" content="cosmética, maquillaje, vegano, contacto, tersa, consultas">
    <title>Tersa — Contacto</title>
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body onload="iniciar()">
    <header class="header-principal">
        <div class="container nav-container">
            <h1 class="logo"><a href="index.html">TERSA</a></h1>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html#inicio">Inicio</a></li>
                    <li><a href="index.html#productos">Productos</a></li>
                    <li><a href="nosotras.html">Nosotras</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
            <div class="nav-cart">
                <button type="button" class="btn btn-borde btn-chico" onclick="abrirCarrito()">Carrito (<span id="contadorCarrito">0</span>)</button>
            </div>
        </div>
    </header>

    <main>
        <section class="contacto-seccion" id="contacto">
            <div class="container">
                <h2 class="titulo-seccion">Contacto / Consultas</h2>
                <p class="subtitulo-seccion">Escribinos tu consulta y te respondemos a la brevedad.</p>
                <form class="formulario-contacto" novalidate="novalidate" onsubmit="return enviarFormulario(event)">
                    <div class="campo">
                        <label for="nombre">Nombre y Apellido:</label>
                        <input type="text" id="nombre" name="nombre" size="30" maxlength="50" placeholder="Tu nombre completo">
                    </div>
                    <div class="campo">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" size="30" maxlength="50" placeholder="ejemplo@correo.com">
                    </div>
                    <div class="campo">
                        <label for="mensaje">Consulta o Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="4" cols="30" maxlength="300" placeholder="Escribinos tu consulta..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primario btn-enviar">Enviar Mensaje</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer-principal">
        <div class="container footer-container">
            <p>&copy; 2026 Tersa Cosmética — Taller de Desarrollo Web</p>
            <div class="footer-links">
                <a href="contacto.html">Contacto</a>
                <a href="https://github.com/lucianeme1205/proyecto2026-Neme-Andreoli" target="_blank" rel="noopener">Repositorio en GitHub</a>
            </div>
        </div>
    </footer>

    <div id="modalCarrito" role="dialog" aria-modal="true" aria-labelledby="tituloCarrito">
    <div id="modalCarritoContenido">
        <h3 id="tituloCarrito">Tu Carrito</h3>
            <div id="listaCarrito"></div>
            <p id="totalCarrito">Total: $ 0</p>
            <div class="modal-acciones">
                <button type="button" class="btn btn-borde btn-chico" onclick="vaciarCarrito()">Vaciar Carrito</button>
                <button type="button" class="btn btn-primario btn-chico" onclick="cerrarCarrito()">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
